<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · CityFlow</title><link rel="stylesheet" href="/assets/shared/app.css?v=20261122-formal6">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-intro"><div class="brand">CITYFLOW <span>即时服务调度</span></div><div><h1>让每一项即时任务<br>都有合适的执行者。</h1></div></section>
    <section class="auth-panel">
      <div class="auth-mode-tabs" role="tablist" aria-label="账号入口">
        <button type="button" data-auth-mode="login" class="active">登录</button>
        <button type="button" data-auth-mode="register">注册</button>
        <button type="button" data-auth-mode="reset">找回密码</button>
      </div>
      <form id="loginForm" data-auth-panel="login">
        <h2>登录 CityFlow</h2>
        <label class="field">邮箱<input id="email" type="email" autocomplete="username" placeholder="name@example.com" required></label>
        <label class="field">密码<input id="password" type="password" autocomplete="current-password" placeholder="输入密码" required></label>
        <button class="button primary full" type="submit">登录</button><p id="message" class="message" role="status"></p>
        <p class="auth-switch">还没有账号？<a href="/register">立即注册</a></p>
        <p class="rider-register-link">还没有骑手账号？<a href="/rider/register">申请骑手账号</a></p>
      </form>

      <form id="registerForm" data-auth-panel="register" hidden>
        <h2>注册 CityFlow</h2>
        <label class="field">昵称<input id="registerName" type="text" maxlength="80" autocomplete="name" required></label>
        <label class="field">邮箱<input id="registerEmail" type="email" autocomplete="email" placeholder="name@example.com" required></label>
        <label class="field">手机号（可选）<input id="registerPhone" type="tel" maxlength="32" autocomplete="tel"></label>
        <label class="field">密码<input id="registerPassword" type="password" minlength="8" autocomplete="new-password" placeholder="至少 8 位" required></label>
        <button class="button primary full" type="submit">创建账号</button><p id="registerMessage" class="message" role="status"></p>
        <p class="rider-register-link">已有账号？<a href="/login">返回登录</a></p>
      </form>

      <div data-auth-panel="reset" hidden>
        <h2>重置密码</h2><p class="muted">通过注册邮箱获取重置码并设置新密码。</p>
        <form id="resetRequestForm">
          <label class="field">注册邮箱<input id="resetEmail" type="email" autocomplete="email" placeholder="name@example.com" required></label>
          <button class="button primary full" type="submit">获取重置码</button>
          <p id="resetRequestMessage" class="message" role="status"></p>
        </form>
        <div id="resetTokenBox" class="reset-token-box" hidden><p>密码重置码</p><code id="resetTokenValue"></code></div>
        <form id="resetConfirmForm">
          <label class="field">注册邮箱<input id="resetConfirmEmail" type="email" autocomplete="email" placeholder="name@example.com" required></label>
          <label class="field">重置码<input id="resetToken" type="text" autocomplete="one-time-code" placeholder="输入重置码" required></label>
          <label class="field">新密码<input id="resetPassword" type="password" minlength="8" autocomplete="new-password" placeholder="至少 8 位" required></label>
          <button class="button primary full" type="submit">设置新密码</button><p id="resetConfirmMessage" class="message" role="status"></p>
        </form>
      </div>
    </section>
  </main><script src="/assets/shared/common.js?v=20261122-formal6" defer></script><script src="/assets/auth/login.js?v=20261122-formal6" defer></script>
</body></html>
