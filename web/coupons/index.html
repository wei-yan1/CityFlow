<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#182b32">
  <title>领券中心 · CityFlow</title>
  <link rel="stylesheet" href="/assets/shared/app.css?v=20261114-coupon1">
  <link rel="stylesheet" href="/assets/coupons/coupons.css?v=20261114-coupon4">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/user"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>CITYFLOW<small>领券中心</small></span></a>
    <div class="top-actions">
      <span id="welcome" class="welcome"></span>
      <a class="button outline" href="/user">返回工作台</a>
      <a class="button subtle" href="/coupons/mine">我的优惠券</a>
      <button class="button outline" data-logout>退出</button>
    </div>
  </header>
  <main class="coupon-page">
    <section class="coupon-hero" aria-labelledby="couponTitle">
      <div class="coupon-hero-copy">
        <p class="coupon-kicker">CITYFLOW COUPON</p>
        <h1 id="couponTitle">先把配送费省下来</h1>
        <p class="coupon-hero-sub">平台补贴的配送优惠券，领取后在发布任务支付时直接抵扣。骑手仍按任务原报价结算，不会因为用券少拿钱。</p>
        <div class="coupon-hero-rules">
          <span>每种券每人限领规则以内</span>
          <span>支付前服务端自动试算</span>
          <span>优惠由平台承担</span>
        </div>
      </div>
      <div class="coupon-metrics" aria-label="优惠券概览">
        <div class="coupon-metric"><strong id="availableCount">—</strong><span>当前可领</span></div>
        <div class="coupon-metric"><strong id="myCouponCount">—</strong><span>我的可用券</span></div>
        <div class="coupon-metric"><strong id="maxSaveCount">—</strong><span>本页最高省</span></div>
        <div class="coupon-metric"><strong id="totalRemaining">—</strong><span>剩余库存</span></div>
      </div>
    </section>
    <nav class="coupon-tabs" aria-label="优惠券页面">
      <a href="/coupons" aria-current="page">领券中心</a>
      <a href="/coupons/mine">我的优惠券<span id="mineTabCount" class="coupon-tab-count" hidden>0</span></a>
    </nav>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <section id="couponGrid" class="coupon-grid" aria-live="polite" aria-busy="true">
      <div class="coupon-empty"><strong>正在读取优惠券…</strong><p>正在向平台获取当前可领取的配送优惠。</p></div>
    </section>
    <p class="coupon-mine-note">演示环境预置了新客、折扣和校园三张券。优惠券在支付创建时锁定，支付成功后核销；支付失败或关闭会自动释放。</p>
  </main>
  <div id="couponToast" class="coupon-toast" role="status" aria-live="polite"></div>
  <script src="/assets/shared/common.js?v=20261114-wheel1" defer></script>
  <script src="/assets/coupons/coupons.js?v=20261114-coupon3" defer></script>
</body>
</html>
