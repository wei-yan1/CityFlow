<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#182b32">
  <title>调度工作台 · CityFlow</title>
  <link rel="stylesheet" href="/assets/shared/app.css?v=20261122-formal6">
<link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css"><link rel="stylesheet" href="/assets/shared/map.css?v=20261122-formal6"></head>
<body class="platform-page">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="brand admin-brand" href="/admin" aria-label="CityFlow 调度工作台">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>CITYFLOW<small>即时服务调度</small></span>
      </a>
      <nav class="side-nav" aria-label="平台管理">
        <button class="nav-item active" data-view="tasks">任务调度</button>
        <button class="nav-item" data-view="users">用户账号</button>
        <button class="nav-item" data-view="merchants">商家资料</button>
        <button class="nav-item" data-view="riders">骑手资料</button>
        <button class="nav-item" data-view="registrations">骑手认证</button>
        <button class="nav-item" data-view="incidents">任务异常</button>
        <button class="nav-item" data-view="reports">骑手举报</button>
        <button class="nav-item" data-view="reviews">评价审计</button>
        <a class="nav-item" href="/admin/redeem-codes">兑换码管理</a>
      </nav>
      <div class="side-spacer"></div>
      <button class="side-logout" data-logout>退出平台</button>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div class="crumb"><span>平台</span><b>/</b><strong id="crumbTitle">任务调度</strong></div>
        <div class="top-actions"><span id="welcome" class="welcome"></span><button id="refresh" class="button outline">刷新</button></div>
      </header>
      <div class="admin-content">
        <section class="admin-heading">
          <div class="heading-copy"><h1 id="viewTitle">任务调度</h1></div>
        </section>

        <div id="notice" class="notice" role="status" aria-live="polite"></div>
        <section class="work-panel">
          <div class="panel-toolbar">
            <div class="panel-title"><h2 id="tableTitle">平台任务</h2><span id="resultCount" class="result-count">加载中</span></div>
            <div class="table-controls">
              <label class="search-box"><input id="search" type="search" placeholder="搜索记录" autocomplete="off"></label>
              <select id="statusFilter" class="filter-select" aria-label="按状态筛选"></select>
              <button id="createButton" class="button primary create-button"><span>＋</span><span id="createLabel">新建</span></button>
            </div>
          </div>
          <div class="table-wrap" id="tableWrap">
            <table class="data-table"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
          </div>
          <div class="table-footer"><span id="pageLabel">第 1 页</span><div class="page-actions"><button class="button outline" id="previousPage">上一页</button><button class="button outline" id="nextPage">下一页</button></div></div>
        </section>
        <section id="mapWorkspace" class="map-workspace" aria-label="任务位置地图">
 <div class="map-toolbar"><div><h2>任务地图</h2></div><div class="map-actions"><button id="mapLocate" type="button" class="button outline">定位到我</button></div></div>
 <div class="map-controls"><label>跟踪任务 <select id="trackedTask" aria-label="选择跟踪任务"><option value="">选择已接单的任务</option></select></label><button id="refreshMap" type="button" class="button outline">刷新地图</button></div>
 <div id="cityMap" class="city-map" aria-label="位置与任务点"></div>
 <div class="map-footer"><div class="map-legend"><span class="legend-shop">商家</span><span class="legend-rider">骑手</span><span class="legend-pickup">取件</span><span class="legend-destination">送达</span></div><span id="mapStatus" role="status" aria-live="polite">地图加载中…</span></div>
 </section>
        </div>
    </main>
  </div>

  <dialog id="editorDialog" class="editor-dialog">
    <form id="editorForm" method="dialog">
      <div class="dialog-top"><div><h2 id="dialogTitle">新建记录</h2></div><button type="button" class="icon-button" id="closeDialog" aria-label="关闭">×</button></div>
      <div id="editorFields" class="dialog-fields"></div>
      <div class="dialog-actions"><button type="button" class="button outline" id="cancelDialog">取消</button><button type="submit" class="button primary" id="saveButton">保存资料</button></div>
    </form>
  </dialog>
  <dialog id="incidentResolveDialog" class="editor-dialog"><form id="incidentResolveForm"><div class="dialog-top"><div><h2 id="incidentResolveTitle">处理任务异常</h2></div><button type="button" class="icon-button" data-close-incident-resolve aria-label="关闭">×</button></div><p id="incidentResolveSummary" class="muted"></p><div class="dialog-fields"><label class="dialog-field full">处理结果<textarea id="incidentResolution" name="resolution" rows="4" maxlength="500" required placeholder="填写处理结果"></textarea></label></div><div class="dialog-actions"><button type="button" class="button outline" data-close-incident-resolve>取消</button><button class="button primary" type="submit">确认处理</button></div><p id="incidentResolveStatus" class="form-status" role="status"></p></form></dialog>
  <script src="/assets/shared/common.js?v=20261122-formal6" defer></script>
  <script src="/assets/shared/geolocation.js" defer></script><script src="/assets/vendor/leaflet/leaflet.js" defer></script><script src="/assets/vendor/fleetops/leaflet-tracking-marker.js" defer></script><script src="/assets/vendor/fleetops/leaflet-adapter.js" defer></script><script src="/assets/vendor/coordtransform/coordtransform.js" defer></script><script src="/assets/shared/map-coordinates.js" defer></script><script src="/assets/shared/map-amap.js?v=20261122-formal6" defer></script><script src="/assets/shared/map-services.js?v=20261122-formal6" defer></script><script src="/assets/shared/map-history.js?v=20261122-formal6" defer></script><script src="/assets/shared/map-city.js?v=20261122-formal6" defer></script><script src="/assets/shared/map.js?v=20261122-formal6" defer></script><script src="/assets/platform/platform.js?v=20261122-formal6" defer></script>
</body>
</html>
