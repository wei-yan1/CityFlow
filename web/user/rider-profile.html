<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1,width=device-width">
  <meta name="theme-color" content="#182b32">
  <title>骑手主页 · CityFlow</title>
  <link rel="stylesheet" href="/assets/shared/app.css?v=20261122-formal7">
  <link rel="stylesheet" href="/assets/user/task.css?v=20261122-formal7">
  <link rel="stylesheet" href="/assets/user/rider-profile.css?v=20261122-formal7">
</head>
<body class="profile-page">
  <header class="task-topbar">
    <a class="brand" href="/user" aria-label="CityFlow 用户工作台"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>CITYFLOW<small>骑手主页</small></span></a>
    <div class="task-top-actions"><span id="profileWelcome" class="welcome"></span><a class="button outline" href="/user">返回任务列表</a><button class="button outline" data-logout>退出</button></div>
  </header>
  <main class="profile-shell">
    <div id="profileNotice" class="notice" role="status" aria-live="polite">正在加载骑手资料…</div>
    <section class="profile-hero" aria-labelledby="profileName">
      <div id="profileAvatar" class="profile-avatar">骑</div>
      <div class="profile-copy">
        <h1 id="profileName">骑手主页</h1>
        <div id="profileTags" class="profile-tags"></div>
      </div>
      <div class="profile-score"><strong id="profileRating">★ —</strong><span id="profileReviewCount">— 条评价</span></div>
      <button id="profileReport" class="button danger-outline" type="button">举报骑手</button>
    </section>
    <div class="profile-grid">
      <section class="card profile-main" aria-labelledby="profileReviewsTitle">
        <div class="task-section-heading"><div><h2 id="profileReviewsTitle">服务评价</h2></div><span id="profileCompleted" class="profile-completed">—</span></div>
        <div id="profileReviews" class="review-list"><p class="muted">正在加载评价…</p></div>
      </section>
      <aside class="profile-aside">
        <section class="card profile-tips" aria-labelledby="profileTipsTitle">
          <div class="task-section-heading"><div><h2 id="profileTipsTitle">额外打赏</h2></div></div>
          <p id="profileTipTotal" class="tip-total">—</p>
          <div id="profileTips" class="review-list"><p class="muted">暂无打赏记录。</p></div>
        </section>
      </aside>
    </div>
  </main>
  <dialog id="profileReportDialog" class="report-dialog">
    <form id="profileReportForm" class="report-form">
      <div class="dialog-top"><div><h2>举报骑手</h2></div><button type="button" class="icon-button" data-close-profile-report aria-label="关闭">×</button></div>
      <label class="field">举报原因<select name="reason" required><option value="">请选择</option><option>骑手态度问题</option><option>配送安全风险</option><option>物品损坏或丢失</option><option>路线或送达异常</option><option>其他问题</option></select></label>
      <label class="field">详细说明<textarea name="details" rows="5" maxlength="1000" placeholder="请说明具体情况" required></textarea></label>
      <label class="field">图片证据（可选）<input id="profileReportImages" type="file" accept="image/*" multiple></label>
      <div id="profileReportPreview" class="report-preview"></div>
      <div class="dialog-actions"><button type="button" class="button outline" data-close-profile-report>取消</button><button type="submit" class="button danger">提交举报</button></div>
      <p id="profileReportStatus" class="form-status" role="status"></p>
    </form>
  </dialog>
  <script src="/assets/shared/common.js?v=20261122-formal7" defer></script>
  <script src="/assets/user/rider-profile.js?v=20261122-formal7" defer></script>
</body>
</html>
