<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173039">
  <title>骑手认证 · CityFlow</title>
  <link rel="stylesheet" href="/assets/shared/app.css?v=20261122-formal6">
  <link rel="stylesheet" href="/assets/rider/register.css?v=20261122-formal6">
</head>
<body class="rider-register-page">
  <main class="register-shell">
    <section class="register-hero">
      <div>
        <a class="brand register-brand" href="/login"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>CITYFLOW<small>骑手认证</small></span></a>
        <h1>完成骑手认证，<br>开通接单账号。</h1>
        <p class="register-lead">提交骑手资料并完成认证费用支付。</p>
      </div>
      <ol class="register-steps">
        <li><span>01</span><div><strong>扫码支付认证费用</strong><p>扫描收款码完成支付，并在付款说明中填写邮箱前缀或手机号后四位。</p></div></li>
        <li><span>02</span><div><strong>提交认证资料</strong><p>填写登录邮箱、密码和骑手资料，并提交支付凭证。</p></div></li>
        <li><span>03</span><div><strong>等待平台核验</strong><p>平台核对支付记录后开通账号。</p></div></li>
      </ol>
      </section>

    <section class="register-panel">
      <div class="pay-card">
        <img src="/assets/rider/registration-qr-card.jpg" alt="支付宝收款码" width="893" height="808">
        <div>
          <h2>支付宝扫码支付</h2>
          <p>认证费用 <strong>¥0.01</strong>。</p>
          </div>
      </div>

      <form id="registrationForm" class="register-form" novalidate>
        <div class="form-heading">
          <div><h2>骑手认证资料</h2></div>
        </div>

        <div class="form-grid">
          <label class="field">姓名<input name="display_name" type="text" maxlength="80" autocomplete="name" required></label>
          <label class="field">登录邮箱<input name="email" type="email" autocomplete="email" required placeholder="name@example.com"></label>
          <label class="field">登录密码<input name="password" type="password" minlength="8" autocomplete="new-password" required placeholder="至少 8 位"></label>
          <label class="field">手机号（可选）<input name="phone" type="tel" maxlength="32" autocomplete="tel"></label>
          <label class="field">车辆类型<select name="vehicle_type" required><option value="E_BIKE">电动车</option><option value="BICYCLE">自行车</option><option value="WALK">步行</option><option value="CAR">汽车</option><option value="OTHER">其他</option></select></label>
          <label class="field">服务区域<input name="service_area" type="text" maxlength="160"></label>
          <div class="skill-field full">
            <span>服务类型</span>
            <div class="skill-options" role="group" aria-label="服务类型">
              <button type="button" class="skill-chip" data-skill="配送" aria-pressed="true">配送</button>
              <button type="button" class="skill-chip" data-skill="代取" aria-pressed="true">代取</button>
              <button type="button" class="skill-chip" data-skill="代购" aria-pressed="false">代购</button>
              <button type="button" class="skill-chip" data-skill="跑腿" aria-pressed="false">跑腿</button>
              <button type="button" class="skill-chip" data-skill="其他" aria-pressed="false">其他</button>
            </div>
            <input name="skills" type="hidden" value="配送,代取">
          </div>
          <label class="field">最大接单距离（米）<input name="max_distance_meters" type="number" min="1" max="100000" step="1" value="5000" required></label>
          <label class="field">同时接单上限<input name="max_concurrent_tasks" type="number" min="1" max="20" step="1" value="3" required></label>
          <label class="field">实付金额（元）<input name="paid_amount" type="number" min="0.01" step="0.01" value="0.01" required inputmode="decimal"></label>
          <label class="field full">支付凭证<input name="payment_reference" type="text" maxlength="128" required placeholder="交易号或付款备注"></label>
          <label class="field full">补充说明（可选）<input name="payment_note" type="text" maxlength="255"></label>
        </div>

        <label class="confirm-row"><input name="confirmed" type="checkbox" required><span>我已支付认证费用，并确认提交的凭证真实有效。</span></label>
        <button id="submitRegistration" class="button primary full" type="submit">提交认证申请</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <p class="register-small">已有账号？<a href="/login">返回登录</a></p>
      </form>

      <section id="successPanel" class="success-panel" hidden aria-live="polite">
        <h2>认证申请已提交</h2>
        <p>平台核验通过后开通账号。</p>
        <p id="successReference" class="success-reference"></p>
        <button id="backToLogin" class="button primary" type="button">返回登录</button>
      </section>
    </section>
  </main>
  <script src="/assets/shared/common.js?v=20261122-formal6" defer></script>
  <script src="/assets/rider/register.js?v=20261122-formal6" defer></script>
</body>
</html>
