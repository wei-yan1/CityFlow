<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182b32"><title>商家工作台 · CityFlow</title><link rel="stylesheet" href="/assets/shared/app.css?v=20261122-formal6"><link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css"><link rel="stylesheet" href="/assets/shared/map.css?v=20261122-formal6"></head>
<body class="merchant-page">
  <header class="topbar"><a class="brand" href="/merchant"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>CITYFLOW<small>商家工作台</small></span></a><div class="top-actions"><span id="welcome" class="welcome"></span><button id="refreshMerchant" class="button outline">刷新门店</button><button id="editProfile" class="button subtle">编辑门店</button><button class="button outline" data-logout>退出</button></div></header>
  <main class="dashboard narrow"><section class="page-heading"><div><h1>经营资料</h1></div></section><div id="notice" class="notice" role="status" aria-live="polite"></div>
    <section id="merchantProfile" class="card profile-card"><div class="empty-state">正在加载门店资料…</div></section>
    <details class="card merchant-media-settings"><summary>门店头像与图片</summary><form id="merchantMediaForm"><input name="avatar_url" type="hidden"><label class="field">上传头像<input id="merchantAvatarFile" type="file" accept="image/jpeg,image/png,image/webp"></label><textarea name="image_urls" rows="4" hidden></textarea><label class="field">上传门店图片（可多选）<input id="merchantImageFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="merchantMediaPreview" class="merchant-media-preview"></div><button class="button primary" type="submit">保存图片</button><p id="merchantMediaStatus" role="status"></p></form></details>
    <section class="map-workspace merchant-map-workspace" aria-label="我的门店地图">
      <div class="map-toolbar"><div><h2>我的门店位置</h2></div><button id="merchantLocate" type="button" class="button outline">定位到我</button></div>
      <form id="merchantSearch" class="map-search-form merchant-map-search"><label>搜索门店地址<input name="keywords" minlength="2" maxlength="100" required></label><label>城市（可选）<input name="city" maxlength="50"></label><button type="submit" class="button outline">搜索地点</button></form>
      <div id="merchantSearchResults" class="map-search-results"></div><p id="merchantMapStatus" class="merchant-map-status" role="status" aria-live="polite">门店地图加载中…</p>
      <div id="merchantMap" class="city-map" aria-label="门店位置，编辑时点击选点"></div>
    </section>
    </main>
  <section id="merchantEditor" class="card merchant-editor" hidden><form id="merchantForm"><div class="dialog-top"><div><h2 id="merchantEditorTitle">编辑门店资料</h2></div><button type="button" class="icon-button" data-close aria-label="关闭">×</button></div><div class="dialog-fields"><label class="dialog-field">门店名称<input name="name" required></label><label class="dialog-field">联系电话<input name="phone" type="tel" pattern="1[3-9][0-9]{9}" maxlength="11"></label><label class="dialog-field full">门店地址<input name="address" required></label><input name="latitude" type="hidden"><input name="longitude" type="hidden"><label class="dialog-field">营业状态<select name="business_status"><option value="OPEN">营业中</option><option value="CLOSED">已关闭</option><option value="PAUSED">暂停接单</option></select></label><label class="dialog-field">每小时服务容量<input name="capacity_per_hour" type="number" min="1" step="1" required></label><input name="amap_poi_id" type="hidden"><label class="dialog-field full">服务分类<select name="service_types" required><option value="FOOD">饮食</option><option value="SUPPLIES">用品</option><option value="OTHER">其它</option></select></label><label class="dialog-field full">门店介绍<textarea name="description"></textarea></label></div><div class="dialog-actions"><button type="button" class="button outline" data-close>取消</button><button class="button primary" type="submit">保存修改</button></div><p id="merchantFormStatus" role="status" aria-live="polite"></p></form></section>
  <script src="/assets/shared/common.js?v=20261122-formal6" defer></script><script src="/assets/shared/geolocation.js" defer></script><script src="/assets/vendor/leaflet/leaflet.js" defer></script><script src="/assets/vendor/fleetops/leaflet-tracking-marker.js" defer></script><script src="/assets/vendor/fleetops/leaflet-adapter.js" defer></script><script src="/assets/vendor/coordtransform/coordtransform.js" defer></script><script src="/assets/shared/map-coordinates.js" defer></script><script src="/assets/shared/map-amap.js?v=20261122-formal6" defer></script><script src="/assets/merchant/merchant.js?v=20261122-formal6" defer></script>
</body></html>
