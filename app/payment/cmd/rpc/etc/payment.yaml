Name: payment.rpc
ListenOn: 127.0.0.1:8094
Mode: dev
Timeout: 10000
DataSource: ""
JWTSecret: ""
RabbitMQURL: ""
IdentityRPC:
  Endpoints:
    - 127.0.0.1:8090
  NonBlock: true
TaskRPC:
  Endpoints:
    - 127.0.0.1:8091
  NonBlock: true
PromotionRPC:
  Endpoints:
    - 127.0.0.1:8098
  NonBlock: true
Provider: MOCK
ExpiryMinutes: 30
SettleIntervalSeconds: 30
AllowMockPay: false
NotifyRetentionDays: 365
XXLJob:
  Enabled: false
  ServerAddr: "http://127.0.0.1:8080/xxl-job-admin"
  AccessToken: ""
  RegistryKey: "cityflow-payment"
  ExecutorIP: ""
  ExecutorPort: "10000"
  TimeoutSeconds: 3
