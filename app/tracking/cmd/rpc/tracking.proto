syntax = "proto3";

package tracking;
option go_package = "cityflow/app/tracking/cmd/rpc/pb";

message Empty {}
message HealthReply { bool ok = 1; string message = 2; }
message JsonBody { bytes body_json = 1; }
message JsonReply { bytes body_json = 1; }
message IdRequest { string id = 1; }
message IdBody { string id = 1; bytes body_json = 2; }
message QueryRequest { bytes query_json = 1; }

service Tracking {
  rpc Health(Empty) returns (HealthReply);
  rpc Report(JsonBody) returns (JsonReply);
  rpc Snapshot(IdRequest) returns (JsonReply);
  rpc History(IdBody) returns (JsonReply);
  rpc Nearby(QueryRequest) returns (JsonReply);
  rpc GetPositionInternal(IdRequest) returns (JsonReply);
}
