syntax = "proto3";

package identity;

option go_package = "./identity";

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message MeRequest {}

message VerifyRequest {}

message Empty {}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string phone = 4;
  string avatar_url = 5;
  string role = 6;
  string status = 7;
  string created_at = 8;
  string updated_at = 9;
}

message AuthReply {
  string access_token = 1;
  string token_type = 2;
  string expires_at = 3;
  string refresh_token = 4;
  User user = 5;
}

message UserReply {
  User user = 1;
}

message VerifyReply {
  string subject = 1;
  string email = 2;
  string role = 3;
  bool active = 4;
  int64 issued_at = 5;
  int64 expires_at = 6;
}

message HealthReply {
  bool ok = 1;
  string message = 2;
}

service Identity {
  rpc Login(LoginRequest) returns (AuthReply);
  rpc Refresh(RefreshRequest) returns (AuthReply);
  rpc Logout(LogoutRequest) returns (Empty);
  rpc Me(MeRequest) returns (UserReply);
  rpc Verify(VerifyRequest) returns (VerifyReply);
  rpc Health(Empty) returns (HealthReply);

  rpc Register(JsonBody) returns (JsonReply);
  rpc RequestPasswordReset(JsonBody) returns (JsonReply);
  rpc ResetPassword(JsonBody) returns (JsonReply);
  rpc UpdateMe(JsonBody) returns (JsonReply);
  rpc ListUsers(ListQuery) returns (JsonReply);
  rpc CreateUser(JsonBody) returns (JsonReply);
  rpc GetUserAdmin(IdRequest) returns (JsonReply);
  rpc UpdateUser(IdBody) returns (JsonReply);
  rpc DisableUser(IdRequest) returns (JsonReply);
  rpc SubmitRiderRegistration(JsonBody) returns (JsonReply);
  rpc ListRiderRegistrations(ListQuery) returns (JsonReply);
  rpc ApproveRiderRegistration(IdBody) returns (JsonReply);
  rpc RejectRiderRegistration(IdBody) returns (JsonReply);
  rpc GetUserInternal(IdRequest) returns (JsonReply);
}

message JsonBody { bytes body_json = 1; }
message JsonReply { bytes body_json = 1; }
message IdRequest { string id = 1; }
message IdBody { string id = 1; bytes body_json = 2; }
message ListQuery { string status = 1; int32 limit = 2; int32 offset = 3; }
