services:
  mysql:
    image: mysql:8.4
    container_name: cityflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: CHANGE_ME_MYSQL_ROOT_PASSWORD
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - cityflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: cityflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - cityflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgis:
    image: postgis/postgis:16-3.4
    container_name: cityflow-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: cityflow_map
      POSTGRES_USER: cityflow
      POSTGRES_PASSWORD: CHANGE_ME_POSTGIS_PASSWORD
    ports:
      - "127.0.0.1:${POSTGIS_PORT:-5434}:5432"
    volumes:
      - "D:/CityFlowData/postgis:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityflow -d cityflow_map"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: cityflow-rabbitmq
    hostname: cityflow-rabbitmq
    restart: unless-stopped
    env_file:
      - rabbitmq.env
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - cityflow_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  cityflow_mysql_data:
  cityflow_redis_data:
  cityflow_rabbitmq_data:
